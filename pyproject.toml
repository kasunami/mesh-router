[project]
name = "mesh-router"
version = "0.1.0"
description = "OpenAI-compatible routing and control-plane service for heterogeneous model workers"
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "MeshRouter contributors" },
]
requires-python = ">=3.11"
keywords = [
  "ai-operations",
  "control-plane",
  "homelab",
  "llm-router",
  "openai-compatible",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "confluent-kafka>=2.5.0",
  "grpcio>=1.80.0",
  "protobuf>=6.31.1,<7",
  "psutil>=5.9",
  "python-json-logger>=2.0.7",
  "redis>=5.0",
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-exporter-otlp>=1.20.0",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
]

[project.urls]
Homepage = "https://github.com/kasunami/mesh-router"
Repository = "https://github.com/kasunami/mesh-router"
Issues = "https://github.com/kasunami/mesh-router/issues"

[project.scripts]
mesh-router = "mesh_router.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "build>=1.2",
  "grpcio-tools==1.80.0",
  "pytest>=8.0",
]

[tool.setuptools]
packages = ["mesh_router", "mesh_router.generated"]

[tool.setuptools.data-files]
"share/mesh-router/sql" = ["sql/*.sql"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
